# Local development database only. Credentials here are for a throwaway local container.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge-dev-only
    ports:
      - "5432:5432"
    volumes:
      - forge-pg:/var/lib/postgresql/data
volumes:
  forge-pg:
